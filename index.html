  <script>
    // --- Web Audio Synthesizer (No external sound files) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playEat() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          const now = this.ctx.currentTime;
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        } catch(e){}
      }
      playPortalWrap() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const now = this.ctx.currentTime;
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.085);
        } catch(e){}
      }
      playDie() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          const now = this.ctx.currentTime;
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(50, now + 0.35);
          gain.gain.setValueAtTime(0.38, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        } catch(e){}
      }
      playTurn() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const now = this.ctx.currentTime;
          osc.frequency.setValueAtTime(320, now);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.035);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        } catch(e){}
      }
    }

    // --- Android Haptic Feedback ---
    function vibrate(pattern) {
      if (typeof navigator !== 'undefined' && 'vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch(e){}
      }
    }

    // --- Game Setup ---
    const sound = new SoundFX();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreValEl = document.getElementById('scoreVal');
    const highScoreValEl = document.getElementById('highScoreVal');
    const diffSelect = document.getElementById('diffSelect');
    const overlay = document.getElementById('overlay');
    const overlayBadge = document.getElementById('overlayBadge');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');
    const soundToggle = document.getElementById('soundToggle');
    const soundIconOn = document.getElementById('soundIconOn');
    const soundIconOff = document.getElementById('soundIconOff');
    const fsToggle = document.getElementById('fsToggle');
    const pauseToggle = document.getElementById('pauseToggle');
    const pauseIcon = document.getElementById('pauseIcon');
    const playIcon = document.getElementById('playIcon');

    const GRID_SIZE = 20; // 20x20 Toroid Grid
    let tileSize = 18;

    let snake = [];
    let food = { x: 5, y: 5, pulse: 0 };
    let dir = { x: 0, y: 0 };
    let nextDir = { x: 0, y: 0 };
    let score = 0;
    let highScore = parseInt(localStorage.getItem('culebrita_highScore') || '0', 10);
    highScoreValEl.textContent = highScore;

    let gameState = 'START'; // 'START', 'RUNNING', 'PAUSED', 'GAMEOVER'
    let lastRenderTime = 0;
    let accumulatedTime = 0;

    // Difficulty Speeds (Interval in ms)
    const SPEED_MAP = {
      casual: 120,
      classic: 85,
      fast: 55
    };
    let stepInterval = SPEED_MAP.classic;

    function resizeCanvas() {
      const containerWidth = canvas.parentElement.clientWidth;
      const size = Math.min(containerWidth, 400);
      canvas.width = size;
      canvas.height = size;
      tileSize = canvas.width / GRID_SIZE;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreValEl.textContent = '0';
      stepInterval = SPEED_MAP[diffSelect.value] || SPEED_MAP.classic;
      spawnFood();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * GRID_SIZE);
        food.y = Math.floor(Math.random() * GRID_SIZE);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
      food.pulse = 0;
    }

    function setDirection(dx, dy) {
      if (gameState !== 'RUNNING') return;
      // Prevent reversing into itself
      if (dx !== 0 && dir.x === -dx) return;
      if (dy !== 0 && dir.y === -dy) return;
      if (nextDir.x !== dx || nextDir.y !== dy) {
        sound.playTurn();
      }
      nextDir = { x: dx, y: dy };
    }

    function update() {
      dir = { ...nextDir };
      let newX = snake[0].x + dir.x;
      let newY = snake[0].y + dir.y;

      // PASS-THROUGH WALLS (Toroidal Screen Wrap)
      let wrapped = false;
      if (newX < 0) {
        newX = GRID_SIZE - 1;
        wrapped = true;
      } else if (newX >= GRID_SIZE) {
        newX = 0;
        wrapped = true;
      }

      if (newY < 0) {
        newY = GRID_SIZE - 1;
        wrapped = true;
      } else if (newY >= GRID_SIZE) {
        newY = 0;
        wrapped = true;
      }

      if (wrapped) {
        sound.playPortalWrap();
        vibrate(15);
      }

      const head = { x: newX, y: newY };

      // Self-collision only (Snake cannot bite itself)
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Food collection
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreValEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreValEl.textContent = highScore;
          localStorage.setItem('culebrita_highScore', highScore);
        }
        sound.playEat();
        vibrate(40);
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      sound.playDie();
      vibrate([60, 40, 110]);

      overlayBadge.textContent = 'GAME OVER';
      overlayBadge.className = 'px-3 py-1 text-xs font-bold uppercase tracking-widest text-rose-300 bg-rose-500/20 border border-rose-500/30 rounded-full mb-2';
      overlayTitle.textContent = `Score: ${score}`;
      overlaySub.textContent = score >= highScore && score > 0 
        ? '🏆 Record Achieved! Giancarlito salutes your reflexes!' 
        : 'Tail bite detected! Remember, you can pass through walls anytime!';
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
      updatePauseUI();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Visual portal grid cues on borders
      ctx.fillStyle = 'rgba(6, 182, 212, 0.08)';
      ctx.fillRect(0, 0, canvas.width, 2);
      ctx.fillRect(0, canvas.height - 2, canvas.width, 2);
      ctx.fillRect(0, 0, 2, canvas.height);
      ctx.fillRect(canvas.width - 2, 0, 2, canvas.height);

      // Subtle background grid points
      ctx.fillStyle = 'rgba(255, 255, 255, 0.035)';
      for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
          ctx.fillRect(i * tileSize + tileSize / 2 - 1, j * tileSize + tileSize / 2 - 1, 2, 2);
        }
      }

      // Draw Apple/Food (Glowing pulse orb)
      food.pulse += 0.08;
      const pulseRadius = (tileSize / 2.3) + Math.sin(food.pulse) * 1.5;
      const fx = food.x * tileSize + tileSize / 2;
      const fy = food.y * tileSize + tileSize / 2;

      ctx.save();
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(fx, fy, Math.max(3, pulseRadius), 0, Math.PI * 2);
      ctx.fill();

      // Apple specular highlight
      ctx.fillStyle = '#ffe4e6';
      ctx.beginPath();
      ctx.arc(fx - 1, fy - 1, pulseRadius * 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw Snake
      snake.forEach((seg, i) => {
        const x = seg.x * tileSize;
        const y = seg.y * tileSize;
        const pad = 1.2;

        ctx.save();
        if (i === 0) {
          // Head (Neon Emerald with Eyes)
          ctx.fillStyle = '#34d399';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 16;
          roundRect(ctx, x + pad, y + pad, tileSize - pad * 2, tileSize - pad * 2, 6);
          ctx.fill();

          // Eyes
          ctx.fillStyle = '#064e3b';
          const eyeSize = 3;
          let eye1 = { x: x + 5, y: y + 5 };
          let eye2 = { x: x + tileSize - 8, y: y + 5 };
          if (dir.x === 1) {
            eye1 = { x: x + tileSize - 6, y: y + 4 };
            eye2 = { x: x + tileSize - 6, y: y + tileSize - 7 };
          } else if (dir.x === -1) {
            eye1 = { x: x + 4, y: y + 4 };
            eye2 = { x: x + 4, y: y + tileSize - 7 };
          } else if (dir.y === 1) {
            eye1 = { x: x + 4, y: y + tileSize - 6 };
            eye2 = { x: x + tileSize - 7, y: y + tileSize - 6 };
          }
          ctx.fillRect(eye1.x, eye1.y, eyeSize, eyeSize);
          ctx.fillRect(eye2.x, eye2.y, eyeSize, eyeSize);
        } else {
          // Body segments with fading luminosity
          const ratio = 1 - (i / snake.length) * 0.45;
          ctx.fillStyle = `rgba(16, 185, 129, ${ratio})`;
          roundRect(ctx, x + pad, y + pad, tileSize - pad * 2, tileSize - pad * 2, 4);
          ctx.fill();
        }
        ctx.restore();
      });
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // Main Loop
    function gameLoop(timestamp) {
      if (!lastRenderTime) lastRenderTime = timestamp;
      const delta = timestamp - lastRenderTime;
      lastRenderTime = timestamp;

      if (gameState === 'RUNNING') {
        accumulatedTime += delta;
        if (accumulatedTime >= stepInterval) {
          update();
          accumulatedTime = 0;
        }
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    // --- State Handlers ---
    function startGame() {
      sound.init();
      initGame();
      gameState = 'RUNNING';
      overlay.classList.add('hidden');
      updatePauseUI();
    }

    function togglePause() {
      if (gameState === 'RUNNING') {
        gameState = 'PAUSED';
        overlayBadge.textContent = 'PAUSED';
        overlayBadge.className = 'px-3 py-1 text-xs font-bold uppercase tracking-widest text-cyan-300 bg-cyan-500/20 border border-cyan-500/30 rounded-full mb-2';
        overlayTitle.textContent = 'PAUSED';
        overlaySub.textContent = 'Catch your breath. Walls are open when you resume.';
        startBtn.textContent = 'Resume';
        overlay.classList.remove('hidden');
      } else if (gameState === 'PAUSED') {
        gameState = 'RUNNING';
        overlay.classList.add('hidden');
      } else if (gameState === 'START' || gameState === 'GAMEOVER') {
        startGame();
      }
      updatePauseUI();
    }

    function updatePauseUI() {
      if (gameState === 'RUNNING') {
        pauseIcon.classList.remove('hidden');
        playIcon.classList.add('hidden');
      } else {
        pauseIcon.classList.add('hidden');
        playIcon.classList.remove('hidden');
      }
    }

    // --- Control Listeners ---
    startBtn.addEventListener('click', () => {
      if (gameState === 'PAUSED') {
        gameState = 'RUNNING';
        overlay.classList.add('hidden');
        updatePauseUI();
      } else {
        startGame();
      }
    });

    pauseToggle.addEventListener('click', togglePause);

    document.getElementById('btnRestart').addEventListener('click', () => {
      vibrate(20);
      startGame();
    });

    diffSelect.addEventListener('change', () => {
      stepInterval = SPEED_MAP[diffSelect.value] || SPEED_MAP.classic;
    });

    soundToggle.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      if (sound.enabled) {
        soundIconOn.classList.remove('hidden');
        soundIconOff.classList.add('hidden');
        sound.init();
      } else {
        soundIconOn.classList.add('hidden');
        soundIconOff.classList.remove('hidden');
      }
    });

    fsToggle.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Touch D-Pad buttons
    document.getElementById('btnUp').addEventListener('pointerdown', (e) => { e.preventDefault(); setDirection(0, -1); });
    document.getElementById('btnDown').addEventListener('pointerdown', (e) => { e.preventDefault(); setDirection(0, 1); });
    document.getElementById('btnLeft').addEventListener('pointerdown', (e) => { e.preventDefault(); setDirection(-1, 0); });
    document.getElementById('btnRight').addEventListener('pointerdown', (e) => { e.preventDefault(); setDirection(1, 0); });

    // Keyboard support (WASD & Arrow Keys)
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          e.preventDefault(); setDirection(0, -1); break;
        case 'ArrowDown':
        case 's':
        case 'S':
          e.preventDefault(); setDirection(0, 1); break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          e.preventDefault(); setDirection(-1, 0); break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          e.preventDefault(); setDirection(1, 0); break;
        case ' ':
          e.preventDefault(); togglePause(); break;
      }
    });

    // Swipe gestures on canvas and touch devices
    let touchStartX = 0;
    let touchStartY = 0;
    const minSwipeDist = 22;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (!touchStartX || !touchStartY || e.changedTouches.length === 0) return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;

      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.max(Math.abs(diffX), Math.abs(diffY)) > minSwipeDist) {
        if (Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX > 0) setDirection(1, 0);
          else setDirection(-1, 0);
        } else {
          if (diffY > 0) setDirection(0, 1);
          else setDirection(0, -1);
        }
      }
      touchStartX = 0;
      touchStartY = 0;
    }, { passive: true });

    window.onload = function() {
      resizeCanvas();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
